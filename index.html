<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html { scroll-behavior: smooth; }
  body { font-family: 'FiraGO', 'Noto Serif Georgian', system-ui, sans-serif; margin: 0; background: #FFFFFF; overscroll-behavior-y: none; }

  /* Reduced motion accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
  .font-display { font-family: 'Noto Serif Georgian', 'Cormorant Garamond', Georgia, serif; font-weight: 600; letter-spacing: -0.015em; }
  .font-display-lat { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
  .grain { position: relative; }
  .grain::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.02;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: multiply;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes floatBig { 0%, 100% { transform: translateY(0) scale(1.35); } 50% { transform: translateY(-22px) scale(1.35); } }
  @keyframes floatBundle { 0%, 100% { transform: translateY(0) scale(1.15); } 50% { transform: translateY(-14px) scale(1.15); } }
  @keyframes pulseSoft { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(-4px); opacity: 0.85; } }
  @keyframes chatGlowPulse {
    0%, 100% { box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4), 0 0 0 0 rgba(229, 5, 113, 0.35); }
    50% { box-shadow: 0 10px 30px -8px rgba(0,0,0,0.4), 0 0 0 14px rgba(229, 5, 113, 0); }
  }
  @keyframes badgePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  @keyframes revealUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes revealLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes revealRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes revealScale { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  .anim-fadeup { animation: fadeUp 0.6s ease-out both; }
  .anim-pulse-soft { animation: pulseSoft 2s ease-in-out infinite; }
  .anim-chat-glow { animation: chatGlowPulse 2.5s ease-out infinite; }
  .anim-badge-pulse { animation: badgePulse 1.8s ease-in-out infinite; }
  .anim-float { animation: float 4s ease-in-out infinite; }
  .anim-float-big { animation: floatBig 5s ease-in-out infinite; }
  .anim-float-bundle { animation: floatBundle 6s ease-in-out infinite; }

  /* Smooth photo rendering — preserves natural product shots */
  img {
    image-rendering: auto;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  /* Scroll-reveal — triggered when 'is-visible' class added by IntersectionObserver */
  .reveal-up, .reveal-left, .reveal-right, .reveal-scale { opacity: 0; will-change: opacity, transform; }
  .reveal-up.is-visible { animation: revealUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal-left.is-visible { animation: revealLeft 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal-right.is-visible { animation: revealRight 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .reveal-scale.is-visible { animation: revealScale 1.1s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .icn { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
  /* 3D tilt for product images — interactive mouse-tracking */
  .product-tilt-3d {
    transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    will-change: transform;
    transform-style: preserve-3d;
  }
  .product-mockup { transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

  .premium-shell {
    background:
      linear-gradient(180deg, #fffcf8 0%, #f7f2ea 48%, #fffcf8 100%);
  }
  .premium-hero {
    min-height: calc(100vh - 12px);
    display: flex;
    align-items: center;
    border-bottom: 1px solid rgba(16, 19, 18, 0.08);
  }
  .premium-kicker {
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-size: 0.68rem;
  }
  .premium-title {
    font-size: clamp(2.75rem, 7vw, 6.25rem);
    line-height: 0.98;
    letter-spacing: 0;
    text-wrap: balance;
  }
  .premium-copy {
    font-size: clamp(1rem, 1.55vw, 1.22rem);
    line-height: 1.75;
  }
  .premium-photo {
    border-radius: 8px;
    background: #f7f2ea;
    box-shadow: 0 36px 90px -38px rgba(16, 19, 18, 0.52);
  }
  .premium-photo::after {
    content: '';
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(255, 252, 248, 0.72);
    border-radius: 6px;
    pointer-events: none;
  }
  .premium-stat {
    border-top: 1px solid rgba(16, 19, 18, 0.12);
  }
  .premium-btn {
    min-height: 54px;
    border-radius: 999px;
  }
  @media (max-width: 640px) {
    .premium-hero {
      min-height: auto;
      padding-top: 24px;
    }
    .premium-title {
      font-size: clamp(2.35rem, 14vw, 3.7rem);
    }
  }

  /* iOS Safari safe-area bottom padding — prevents content from sitting under translucent toolbar */

    padding-bottom: env(safe-area-inset-bottom);
